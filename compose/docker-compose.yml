# Entire gabot product in Compose. Production mapping is in docs/deploy.md.
#
# Auth emulator listens 0.0.0.0:9099 inside the container. The API uses
# FIREBASE_AUTH_EMULATOR_HOST=auth:9099. The browser (and Playwright) use
# localhost:9099 on the published loopback port.

services:
  omni:
    # Local system of record. Production is AlloyDB.
    # AlloyDB Omni ARM is Preview; default image is pgvector/pgvector:pg17 with the same schema.
    # To try Omni: GABOT_DB_IMAGE=google/alloydbomni:16.8.0 (keep PGDATA subdirectory).
    image: ${GABOT_DB_IMAGE:-pgvector/pgvector:pg17}
    environment:
      POSTGRES_DB: gabot
      POSTGRES_USER: gabot
      POSTGRES_PASSWORD: gabot
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - 127.0.0.1:5432:5432
    volumes:
      - omni-data:/var/lib/postgresql/data
    healthcheck:
      test: pg_isready -U gabot -d gabot
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - data

  migrate:
    build:
      context: ..
      dockerfile: docker/Dockerfile.node
      args:
        PACKAGE: api
    working_dir: /app/packages/api
    command: [node, dist/migrate.js]
    environment:
      DATABASE_URL: postgres://gabot:gabot@omni:5432/gabot
    depends_on:
      omni:
        condition: service_healthy
    restart: 'no'
    networks:
      - data

  auth:
    build:
      context: ..
      dockerfile: docker/Dockerfile.firebase
    ports:
      - 127.0.0.1:9099:9099
    healthcheck:
      test: node -e "fetch('http://127.0.0.1:9099').then(()=>process.exit(0),()=>process.exit(1))"
      interval: 5s
      timeout: 5s
      retries: 20

  scripted-model:
    build:
      context: ..
      dockerfile: docker/Dockerfile.node
      args:
        PACKAGE: scripted-model
    environment:
      PORT: 4400
    ports:
      - 127.0.0.1:4400:4400
    healthcheck:
      test: node -e "fetch('http://127.0.0.1:4400/health').then(r=>process.exit(r.ok?0:1))"
      interval: 5s
      timeout: 5s
      retries: 10

  mcp-mock:
    build:
      context: ..
      dockerfile: docker/Dockerfile.node
      args:
        PACKAGE: mcp-mock
    environment:
      PORT: 4300
    ports:
      - 127.0.0.1:4300:4300
    healthcheck:
      test: node -e "fetch('http://127.0.0.1:4300/health').then(r=>process.exit(r.ok?0:1))"
      interval: 5s
      timeout: 5s
      retries: 10

  agent:
    build:
      context: ..
      dockerfile: docker/Dockerfile.node
      args:
        PACKAGE: agent
    environment:
      PORT: 4200
      MODEL_BASE_URL: http://scripted-model:4400/v1
      DATABASE_URL: postgres://gabot:gabot@omni:5432/gabot
      GABOT_IDENTITY_SECRET: gabot-dev-identity-secret
      API_AUDIENCE: http://api:3001
    ports:
      - 127.0.0.1:4200:4200
    depends_on:
      scripted-model:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: node -e "fetch('http://127.0.0.1:4200/health').then(r=>process.exit(r.ok?0:1))"
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - default
      - data

  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile.node
      args:
        PACKAGE: api
    environment:
      PORT: 3001
      DATABASE_URL: postgres://gabot:gabot@omni:5432/gabot
      FIREBASE_AUTH_EMULATOR_HOST: auth:9099
      FIREBASE_PROJECT_ID: demo-gabot
      AGENT_URL: http://agent:4200
      MCP_MOCK_URL: http://mcp-mock:4300
      GABOT_IDENTITY_SECRET: gabot-dev-identity-secret
      KEY_ENCRYPTION_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      INITIAL_ADMIN_EMAILS: admin@example.com
      WORKER_SHARED_SECRET: gabot-dev-worker-secret
    ports:
      - 127.0.0.1:3001:3001
    depends_on:
      migrate:
        condition: service_completed_successfully
      auth:
        condition: service_healthy
      agent:
        condition: service_healthy
      mcp-mock:
        condition: service_healthy
    healthcheck:
      test: node -e "fetch('http://127.0.0.1:3001/health').then(r=>process.exit(r.ok?0:1))"
      interval: 5s
      timeout: 5s
      retries: 15
    networks:
      - default
      - data

  jobs:
    build:
      context: ..
      dockerfile: docker/Dockerfile.node
      args:
        PACKAGE: jobs
    environment:
      PORT: 4600
      DATABASE_URL: postgres://gabot:gabot@omni:5432/gabot
      API_INTERNAL_URL: http://api:3001
      WORKER_SHARED_SECRET: gabot-dev-worker-secret
    depends_on:
      migrate:
        condition: service_completed_successfully
      api:
        condition: service_healthy
    healthcheck:
      test: node -e "fetch('http://127.0.0.1:4600/health').then(r=>process.exit(r.ok?0:1))"
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - default
      - data

  app:
    build:
      context: ..
      dockerfile: docker/Dockerfile.app
    environment:
      VITE_FIREBASE_AUTH_EMULATOR_HOST: 127.0.0.1:9099
      VITE_FIREBASE_PROJECT_ID: demo-gabot
      VITE_API_PROXY: http://api:3001
    ports:
      - 127.0.0.1:3010:3010
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: node -e "fetch('http://127.0.0.1:3010').then(r=>process.exit(r.ok?0:1))"
      interval: 5s
      timeout: 5s
      retries: 15

networks:
  # Omni, migrate, api, jobs, and the agent (Mastra PostgresStore only).
  data:
    driver: bridge
  default:

volumes:
  omni-data:
