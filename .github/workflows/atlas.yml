name: Atlas Migrations

on:
  push:
    branches: [main]
    paths:
      - db/migrations/**
      - db/seed/**
      - atlas.hcl
      - .squawk.toml
      - .github/workflows/atlas.yml
  pull_request:
    paths:
      - db/migrations/**
      - db/seed/**
      - atlas.hcl
      - .squawk.toml
      - .github/workflows/atlas.yml
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: read-all

env:
  ATLAS_IMAGE: arigaio/atlas:1.3.3-community
  DATABASE_URL: postgres://gabot:gabot@localhost:5432/gabot?sslmode=disable

jobs:
  migrate:
    name: Lint and apply migrations
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_DB: gabot
          POSTGRES_USER: gabot
          POSTGRES_PASSWORD: gabot
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U gabot -d gabot"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Harden Runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - name: Install Squawk
        run: |
          curl -sSfL https://github.com/sbdchd/squawk/releases/download/v2.64.0/squawk-linux-x64 -o /tmp/squawk
          sudo install -m 0755 /tmp/squawk /usr/local/bin/squawk
          squawk --version

      - name: Lint migrations with Squawk
        run: squawk db/migrations/*.sql

      - name: Verify atlas.sum
        run: |
          docker run --rm -v "$PWD/db/migrations:/migrations" "$ATLAS_IMAGE" \
            migrate hash --dir file://migrations
          git diff --exit-code -- db/migrations/atlas.sum

      - name: Apply migrations
        run: |
          docker run --rm --network host \
            -v "$PWD/db/migrations:/migrations" \
            "$ATLAS_IMAGE" \
            migrate apply \
            --url "$DATABASE_URL" \
            --dir file://migrations

      - name: Smoke schema
        run: |
          docker run --rm --network host \
            -e PGPASSWORD=gabot \
            pgvector/pgvector:pg17 \
            psql -h 127.0.0.1 -U gabot -d gabot -v ON_ERROR_STOP=1 \
            -c "SELECT to_regclass('public.users') IS NOT NULL AS users_ok;" \
            -c "SELECT to_regclass('public.runs') IS NOT NULL AS runs_ok;" \
            -c "SELECT to_regclass('public.mastra_threads') IS NOT NULL AS mastra_ok;" \
            -c "SELECT to_regclass('atlas_schema_revisions.atlas_schema_revisions') IS NOT NULL AS revisions_ok;"
